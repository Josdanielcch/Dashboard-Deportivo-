[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/panel"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/panel/*"
  to = "/panel/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for ultra-fast CDN delivery and PageSpeed Best Practices
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
