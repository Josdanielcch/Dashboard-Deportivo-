openapi: 3.0.3
info:
  title: SportSpaces OS API
  description: >
    API RESTful de Grado Empresarial para la Gestión Integral de Complejos Deportivos
    (Reservas Inteligentes, Facturación, Inventario POS, Pasarelas de Pago y Auditoría).
  version: 2.0.0
  contact:
    name: Soporte Técnico SportSpaces OS
    email: soporte@sportspaces.com
servers:
  - url: http://localhost:3000/api
    description: Servidor de Desarrollo Local
  - url: https://dashboard-deportivo.onrender.com/api
    description: Servidor de Producción / Staging

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        court_id:
          type: integer
        booking_date:
          type: string
          format: date
          example: '2026-10-25'
        start_time:
          type: string
          example: '18:00'
        end_time:
          type: string
          example: '19:00'
        status:
          type: string
          enum: [Pending, Pending_Payment, Confirmed, Paid, Completed, Cancelled, Expired, No_show]
        total_amount:
          type: number
          format: float
          example: 25.00
        payment_method:
          type: string
          example: 'card'

    Billing:
      type: object
      properties:
        id:
          type: integer
        booking_id:
          type: integer
          nullable: true
        customer_id:
          type: integer
        user_id:
          type: integer
        payment_method_id:
          type: integer
        total_amount:
          type: number
          format: float
        payment_date:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        membership_level:
          type: string
          enum: [standard, pro, vip]

    BusinessSettings:
      type: object
      properties:
        business_name:
          type: string
        legal_id:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        timezone:
          type: string
          example: 'America/Caracas'
        default_currency:
          type: string
          example: 'USD'
        tax_rate:
          type: number
          example: 0.16
        logo_url:
          type: string
        primary_color:
          type: string
          example: '#15803d'

paths:
  /auth/login:
    post:
      summary: Inicio de sesión del personal administrativo
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso y entrega de JWT
        '401':
          description: Credenciales inválidas

  /auth/client/login:
    post:
      summary: Inicio de sesión de clientes finales (Website)
      tags: [Autenticación Clientes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Correo electrónico del cliente
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso

  /bookings:
    get:
      summary: Listar todas las reservas (Solo Staff)
      tags: [Reservas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de reservas
    post:
      summary: Crear nueva reserva (Con bloqueo de concurrencia y rate limiter)
      tags: [Reservas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [court_id, booking_date, start_time, end_time]
              properties:
                court_id:
                  type: integer
                booking_date:
                  type: string
                  format: date
                start_time:
                  type: string
                end_time:
                  type: string
                customer_id:
                  type: integer
      responses:
        '201':
          description: Reserva creada con éxito
        '400':
          description: Fecha pasada o parámetros inválidos
        '409':
          description: Horario no disponible (Conflicto de Overbooking prevenido)
        '429':
          description: Límite de reservas pendientes alcanzado o rate limit excedido

  /bookings/check-availability:
    get:
      summary: Verificar disponibilidad de una cancha en tiempo real
      tags: [Reservas]
      parameters:
        - in: query
          name: court_id
          required: true
          schema:
            type: integer
        - in: query
          name: booking_date
          required: true
          schema:
            type: string
        - in: query
          name: start_time
          required: true
          schema:
            type: string
        - in: query
          name: end_time
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consulta exitosa de disponibilidad

  /payments/checkout:
    post:
      summary: Iniciar sesión de pago en línea y apartar slot (Holding 10 min)
      tags: [Pagos y Pasarelas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, amount]
              properties:
                booking_id:
                  type: integer
                amount:
                  type: number
                currency:
                  type: string
                  default: 'USD'
      responses:
        '200':
          description: Sesión de checkout creada con URL de pago

  /payments/webhook:
    post:
      summary: Webhook para confirmación automática de pagos (Stripe / Pasarelas)
      tags: [Pagos y Pasarelas]
      responses:
        '200':
          description: Notificación recibida y procesada

  /settings:
    get:
      summary: Obtener configuración pública y de marca (White-Label)
      tags: [Configuración]
      responses:
        '200':
          description: Datos de configuración y marca
    put:
      summary: Actualizar configuración empresarial (Solo Admin)
      tags: [Configuración]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuración actualizada
        '403':
          description: Acceso denegado (Requiere Administrador)
